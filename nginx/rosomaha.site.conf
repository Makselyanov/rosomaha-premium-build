# Canonical production nginx config for xn--80aa8ahaki9a.site.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xn--80aa8ahaki9a.site;

    ssl_certificate /etc/letsencrypt/live/xn--80aa8ahaki9a.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aa8ahaki9a.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://xn--80aa8ahaki9a.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn--80aa8ahaki9a.site;

    root /var/www/rosomaha/current;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The browser talks only to this same-origin endpoint. Nginx pins the real
    # CRM tenant/origin and adds a root-owned bearer token that is never shipped
    # in the frontend bundle. The include is provisioned on the server by
    # scripts/configure-finance-intake-proxy.sh and must stay outside Git.
    location = /api/finance/public-intake {
        limit_except GET POST OPTIONS {
            deny all;
        }

        client_max_body_size 16k;
        client_body_timeout 10s;

        proxy_pass https://rosomaha.centrlp.ru/api/finance/public-intake;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name rosomaha.centrlp.ru;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Host rosomaha.centrlp.ru;
        proxy_set_header Origin https://xn--80aa8ahaki9a.site;
        proxy_set_header Referer "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/rosomaha-finance-intake-secret.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_redirect off;
        proxy_buffering off;
        proxy_hide_header Set-Cookie;
    }

    # Collapse /catalog/ and article/model trailing-slash duplicates to the
    # canonical no-trailing-slash routes used by the app and sitemaps.
    location ~ ^(.+)/$ {
        return 301 https://xn--80aa8ahaki9a.site$1$is_args$args;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(xml|txt)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    ssl_certificate /etc/letsencrypt/live/xn--80aa8ahaki9a.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aa8ahaki9a.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name xn--80aa8ahaki9a.site www.xn--80aa8ahaki9a.site;
    return 301 https://xn--80aa8ahaki9a.site$request_uri;
}
